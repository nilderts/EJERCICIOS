<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <h1 align="center" style="color: blue;">REGISTRO DE ESTUDIANTES</h1>
        <form action="registro_estudiante.php" method="POST" name="frmestudiante">
            <table border="1" align="center" bgcolor="white">
                <tr bgcolor="#AED6F1" align="center">
                    <th colspan="2">DATOS PERSONALES DEL ESTUDIANTE</th>
                </tr>
                <tr>
                    <td>Nombres y Apellidos:</td>
                    <td>
                        <input type="text" name="txtnombres" placeholder="Nombres y Apellidos">
                    </td>
                </tr>
                <tr>
                    <td>DNI:</td>
                    <td><input type="text" name="txtdni" placeholder="12345678" maxlength="8"></td>
                </tr>
                <tr>
                    <td>Correo electrónico:</td>
                    <td><input type="email" name="txtcorreo" placeholder="nickname@tudominio.com"></td>
                </tr>
                <tr>
                    <td>Teléfono</td>
                    <td><input type="text" name="txttelefono" placeholder="ingrese su número"></td>
                </tr>
                <tr>
                    <td>Fecha de nacimiento:</td>
                    <td><input type="date" name="txtfecha"></td>
                </tr>
                <tr>
                    <td>Dirección:</td>
                    <td>
                        <textarea rows="5" cols="50"></textarea>
                    </td>
                </tr>
                <tr bgcolor="#D6EAF8" align="center">
                    <th colspan="2">INFORMACIÓN ACADÉMICA</th>
                </tr>
                <tr>
                    <td>Programa de estudios:</td>
                    <td>
                        <select>
                            <option>Desarrollo de Sistemas de Información</option>
                            <option>Enfermería Técnica</option>
                            <option>Producción Agropecuaria</option>
                            <option>Construcción Civil</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Semestre:</td>
                    <td>
                        <select>
                            <option>I semestre</option>
                            <option>II semestre</option>
                            <option>III semestre</option>
                            <option>IV semestre</option>
                            <option>V semestre</option>
                            <option>VI semestre</option>
                        </select>
                    </td>
                </tr>
                <tr gbcolor="#D5F5E3">
                    <th colspan="2">DOCUMENTOS DEL ESTUDIANTE</th>
                </tr>
                <tr>
                    <td>Foto de Perfil:</td>
                    <td> <input type="file" accept=".jpg,.jpeg,.png"></td>
                </tr>
                <tr>
                    <td>DNI Escaneado:</td>
                    <td><input type="file" accept=".pdf"></td>
                </tr>
                <tr>
                    <td>Observaciones:</td>
                    <td><textarea rows="5" cols="50"></textarea></td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <input type="submit" value="Registrar Estudiante" style="background-color: green; color: white;">
                        <input type="reset" value="Limpiar formulario" style="background-color: red; color: white;">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
